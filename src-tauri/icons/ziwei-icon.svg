<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#2c3d96"/>
      <stop offset="52%" stop-color="#1b2564"/>
      <stop offset="100%" stop-color="#0a0f33"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#c98a1b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6be0"/>
      <stop offset="100%" stop-color="#131f57"/>
    </linearGradient>
  </defs>

  <!-- 夜空圆盘 -->
  <circle cx="512" cy="512" r="470" fill="url(#sky)"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#gold)" stroke-width="20"/>

  <!-- 星空散布 -->
  <g fill="#cdd7ff" opacity="0.75">
    <circle cx="330" cy="245" r="6"/>
    <circle cx="700" cy="330" r="5"/>
    <circle cx="268" cy="560" r="5"/>
    <circle cx="742" cy="620" r="6"/>
    <circle cx="620" cy="840" r="5"/>
    <circle cx="350" cy="790" r="4"/>
  </g>

  <!-- 北斗七星 -->
  <g stroke="#f7d98a" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="470" y1="205" x2="492" y2="172"/>
    <line x1="492" y1="172" x2="527" y2="158"/>
    <line x1="527" y1="158" x2="557" y2="174"/>
    <line x1="557" y1="174" x2="576" y2="208"/>
    <line x1="576" y1="208" x2="588" y2="248"/>
    <line x1="588" y1="248" x2="566" y2="286"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="470" cy="205" r="17"/>
    <circle cx="492" cy="172" r="13"/>
    <circle cx="527" cy="158" r="15"/>
    <circle cx="557" cy="174" r="12"/>
    <circle cx="576" cy="208" r="16"/>
    <circle cx="588" cy="248" r="13"/>
    <circle cx="566" cy="286" r="12"/>
  </g>

  <!-- 底部三台三星 -->
  <g fill="url(#gold)">
    <circle cx="468" cy="780" r="10"/>
    <circle cx="512" cy="804" r="16"/>
    <circle cx="556" cy="780" r="10"/>
  </g>

  <!-- 罗盘环 -->
  <circle cx="512" cy="512" r="362" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#f5c542" stroke-width="3" opacity="0.55"/>

  <!-- 12 宫刻度 -->
  <g stroke="url(#gold)" stroke-linecap="round">
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="15" transform="rotate(0 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(30 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(60 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="15" transform="rotate(90 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(120 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(150 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="15" transform="rotate(180 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(210 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(240 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="15" transform="rotate(270 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(300 512 512)"/>
    <line x1="512" y1="120" x2="512" y2="176" stroke-width="10" transform="rotate(330 512 512)"/>
  </g>

  <!-- 四正小菱形标记 -->
  <g fill="#ffe9a3">
    <rect x="504" y="95" width="16" height="16" rx="3" transform="rotate(0 512 512)"/>
    <rect x="504" y="95" width="16" height="16" rx="3" transform="rotate(90 512 512)"/>
    <rect x="504" y="95" width="16" height="16" rx="3" transform="rotate(180 512 512)"/>
    <rect x="504" y="95" width="16" height="16" rx="3" transform="rotate(270 512 512)"/>
  </g>

  <!-- 太极（阴阳鱼） -->
  <g transform="translate(512 545)">
    <circle cx="0" cy="0" r="200" fill="url(#gold)"/>
    <path d="M 0 -200 A 200 200 0 0 1 0 200 Z" fill="url(#water)"/>
    <circle cx="-100" cy="0" r="100" fill="url(#water)"/>
    <circle cx="100" cy="0" r="100" fill="#e8b43c"/>
    <circle cx="100" cy="0" r="34" fill="url(#water)"/>
    <circle cx="-100" cy="0" r="34" fill="#ffe9a3"/>
  </g>

  <circle cx="512" cy="512" r="470" fill="none" stroke="#cfb56a" stroke-width="5" opacity="0.35"/>
</svg>